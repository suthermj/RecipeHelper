name: Smoke Test

# Runs the existing Playwright suite (tests/playwright/ui.spec.ts) against
# production right after a deploy finishes. That suite's baseURL is already
# hardcoded to https://sutherlinsrecipes.duckdns.org (see playwright.config.ts)
# — it was previously unused by any workflow. This closes the loop on "the
# deploy step succeeded" vs. "the app actually renders correctly", catching
# things like the documented ephemeral-data-protection-keys blank-page issue
# or a layout regression, automatically, without waiting to notice on-device.
on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types: [completed]

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Check out the exact commit that was just deployed, so the test file
      # matches what's actually live.
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        working-directory: RecipeHelper
        run: npm ci

      - name: Install Playwright browsers
        working-directory: RecipeHelper
        run: npx playwright install --with-deps chromium

      # The deploy's last step restarts the systemd service; give it a few
      # seconds to come back up before hammering it with the suite so a slow
      # restart doesn't read as a false-positive failure.
      - name: Wait for site to come back up
        run: |
          for i in $(seq 1 10); do
            if curl -sf -o /dev/null https://sutherlinsrecipes.duckdns.org/Recipe; then
              echo "Site is up"
              exit 0
            fi
            echo "Waiting for site... (attempt $i)"
            sleep 3
          done
          echo "Site did not come back up in time" >&2
          exit 1

      - name: Run smoke tests against production
        id: run_tests
        working-directory: RecipeHelper
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: RecipeHelper/playwright-report/
          retention-days: 7

      # This workflow runs via workflow_run, so it doesn't attach as a native
      # PR check the way build.yml/codeql.yml do — post a result comment
      # instead so it's visible on the PR at all. Only fires when the deployed
      # commit belongs to an open PR (workflow_run.pull_requests is empty for
      # a direct/merged push to main). Edits the same comment on every run
      # (matched via the hidden marker) instead of posting a new one each
      # time, so repeated pushes to a PR don't pile up duplicate comments.
      - name: Find existing smoke test comment
        if: always() && github.event.workflow_run.pull_requests[0]
        id: find_comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- smoke-test-results -->'

      - name: Post or update smoke test comment
        if: always() && github.event.workflow_run.pull_requests[0]
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          edit-mode: replace
          body: |
            <!-- smoke-test-results -->
            ### 🧪 Smoke test — ${{ steps.run_tests.outcome == 'success' && '✅ passed' || '❌ failed' }}

            Ran against production (`sutherlinsrecipes.duckdns.org`) after deploy of `${{ github.event.workflow_run.head_sha }}`.

            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
