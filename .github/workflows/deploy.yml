name: Deploy to Production

# Deploys automatically whenever a PR (targeting main) is opened or pushed to
# with a source-code change (docs-only commits are skipped — see paths-ignore
# below), so a branch's latest commit is live for on-device testing without a
# manual step. Also runnable manually anytime from the Actions tab (works fine
# from the GitHub mobile app) — deploys whichever branch is picked in the "Use
# workflow from" selector, e.g. to redeploy main itself or a branch with no
# open PR.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    # Skip commits that only touch docs -- a CHANGELOG/CLAUDE.md-only push
    # shouldn't redeploy production.
    paths-ignore:
      - '**.md'

concurrency:
  group: deploy-production
  # A newer push should supersede an in-flight deploy of an now-stale commit
  # rather than queue behind it — matters more now that pushes to an open PR
  # trigger a deploy automatically and can arrive in quick succession.
  cancel-in-progress: true

env:
  DEPLOY_USER: deploy

jobs:
  deploy:
    # Guards against a forked PR ever triggering a deploy with this repo's
    # secrets. workflow_dispatch is always same-repo by definition, so this
    # only meaningfully restricts the pull_request trigger.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    env:
      # For pull_request events, github.sha is a synthetic merge-preview commit,
      # not the actual PR branch tip -- deploy the real head commit instead.
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout ${{ env.DEPLOY_SHA }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        working-directory: RecipeHelper
        run: npm ci

      - name: Build CSS
        working-directory: RecipeHelper
        run: npm run css:build

      # Stamps the deployed commit SHA into the service worker's cache version so
      # every deploy invalidates old PWA caches automatically — no more relying on
      # a human to remember to bump CACHE_VERSION in sw.js by hand.
      - name: Stamp service worker cache version
        run: sed -i "s/const CACHE_VERSION = '.*';/const CACHE_VERSION = '${{ env.DEPLOY_SHA }}';/" RecipeHelper/wwwroot/sw.js

      - name: Publish linux-x64
        working-directory: RecipeHelper
        run: dotnet publish -c Release -r linux-x64 --self-contained false -o ../publish

      - name: Package build
        run: tar -czf publish.tar.gz -C publish .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: api.tailscale.com/T13yDC73BC11CNTRL-kL43gFyah721CNTRL
          tags: tag:ci

      # DEPLOY_HOST is the VM's Tailscale hostname (e.g. "hetzner-vm") — set as a
      # production environment secret. SSH goes over Tailscale so port 22 stays
      # locked to your home IP in the Hetzner firewall.
      - name: Configure deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # The `deploy` user's key is restricted server-side to a single forced
      # command (see deploy/remote/README.md) — whatever we pass here is
      # ignored, the tarball just needs to arrive on stdin.
      - name: Ship build and restart service
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" < publish.tar.gz

      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Result
        run: echo "Deployed ${{ github.head_ref || github.ref_name }} (${{ env.DEPLOY_SHA }}) — https://sutherlinsrecipes.duckdns.org"
