name: "CodeQL"

# Security code scanning for the C# backend and the JS/TS frontend
# (site.js, Playwright tests). Free for public repos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1' # weekly, Monday 03:30 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['csharp', 'javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET 8
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # RecipeHelper.csproj runs `npm run css:build` as an MSBuild target
      # (BeforeTargets="Build"), so `dotnet build` fails without node_modules
      # in place first.
      - name: Setup Node
        if: matrix.language == 'csharp'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        if: matrix.language == 'csharp'
        working-directory: RecipeHelper
        run: npm ci

      - name: Build C#
        if: matrix.language == 'csharp'
        working-directory: RecipeHelper
        run: dotnet build -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
